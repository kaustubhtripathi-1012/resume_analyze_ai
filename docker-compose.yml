version: '3.8'

services:
  mongodb:
    image: mongo:7
    container_name: resume_analyzer_mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: resume_analyzer
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  nlp-service:
    build:
      context: ./nlp-service
      dockerfile: Dockerfile
    container_name: resume_analyzer_nlp
    ports:
      - "8000:8000"
    environment:
      SERVICE_KEY: ${NLP_SERVICE_KEY}
      SPACY_MODEL: en_core_web_md
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 10s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: resume_analyzer_backend
    ports:
      - "5000:5000"
    depends_on:
      mongodb:
        condition: service_healthy
      nlp-service:
        condition: service_healthy
    environment:
      PORT: 5000
      MONGODB_URI: mongodb://mongodb:27017/resume_analyzer
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      JWT_ACCESS_EXPIRES: 15m
      JWT_REFRESH_EXPIRES: 7d
      NLP_SERVICE_URL: http://nlp-service:8000
      NLP_SERVICE_KEY: ${NLP_SERVICE_KEY}
      UPLOAD_DIR: /app/uploads
      MAX_FILE_SIZE: 5242880
      NODE_ENV: production
    volumes:
      - ./backend/uploads:/app/uploads

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: resume_analyzer_frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  mongo_data:
    driver: local
